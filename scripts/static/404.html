<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到这一页 · Inno Agent 技能库</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{--paper:#f7f4ed;--ink:#14140f;--muted:#6f6c63;--cta:#1f6f4a;--line:#e2ded6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}
  main{max-width:520px;text-align:center}
  .art{display:inline-grid;grid-template-columns:repeat(3,28px);gap:6px;margin-bottom:28px}
  .art i{display:block;height:28px;background:var(--cta)}
  .art i:nth-child(2){background:#e8b06b}.art i:nth-child(4){background:var(--ink)}
  .art i:nth-child(6){background:#c96a5a}.art i:nth-child(8){background:#7a93b8}
  .art i:nth-child(5),.art i:nth-child(9){background:transparent;border:1px dashed var(--line)}
  h1{font-size:clamp(28px,6vw,44px);letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
  p{color:var(--muted);line-height:1.7;margin-bottom:26px}
  a.btn{display:inline-block;background:var(--cta);color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}
  a.btn+a.btn{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}
</style>
</head>
<body>
<main>
  <div class="art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>这块图还没画出来</h1>
  <p>你要找的页面不存在,或者技能已经改名了。<br>回星图重新找找,或者直接翻全部技能。</p>
  <a class="btn" href="./index.html">回到星图</a>
  <a class="btn" href="./all.html">全部技能</a>
</main>
</body>
</html>
