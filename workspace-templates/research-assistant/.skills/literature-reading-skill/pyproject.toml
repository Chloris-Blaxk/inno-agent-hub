[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-reading-skill"
version = "0.2.0"
description = "文献阅读全流程助手 Skill——文献筛选、速读、精读(融合 paper_qa_runtime)、横向比较、证据卡片化"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
lit-reading = "adapters.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = [
    "paper_qa_runtime",
    "adapters",
]

[tool.setuptools.package-data]
paper_qa_runtime = ["prompts/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
