<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inno Agent · 技能库</title>
<meta name="description" content="Inno Agent Skill Library — 面向教学、自学、研究与创作的可直接调用技能。">
<style>
  :root{
    --paper:#f7f4ed; --ink:#14140f; --muted:#6f6c63; --line:#e2ded6;
    --cta:#1f6f4a; --hair:rgba(20,20,15,.19);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 拉丁走 Georgia、中文回落思源/宋体 */
  .serif{font-family:Georgia,"Times New Roman","Songti SC","Source Han Serif SC","Noto Serif SC",serif}

  /* ── header ── */
  header{position:fixed; inset:0 0 auto 0; z-index:50; padding:20px 26px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; pointer-events:none;
    opacity:0; transition:opacity .7s ease .35s}
  header.in{opacity:1}
  header > *{pointer-events:auto}
  .logo{font-weight:800; letter-spacing:-.02em; font-size:16px}
  .logo span{color:var(--cta)}
  .navlinks{display:flex; gap:8px; align-items:center}
  .nlink{font-size:12.5px; color:var(--muted); text-decoration:none; border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; background:rgba(251,250,248,.82); backdrop-filter:blur(6px);
    white-space:nowrap; transition:.18s}
  .nlink:hover{color:var(--ink); border-color:#c3bdaf; transform:translateY(-1px)}
  .nlink.solid{background:var(--ink); color:#fff; border-color:var(--ink)}
  .nlink.solid:hover{background:#000; color:#fff}

  /* ── 画布 ── */
  #viewport{position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none}
  #viewport.dragging{cursor:grabbing}
  #stage{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
  #wires{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
  .wire{stroke:var(--hair); stroke-width:.9; fill:none; transition:stroke .28s, stroke-width .28s, opacity .28s}
  .wire.alt{stroke-dasharray:3 4; opacity:.62}
  .wire.lit{stroke:var(--sc,#3f5c48); stroke-width:1.7; opacity:1}

  /* ── 开场:两个词先合成 “Inno Agent” 居中,再向两角打开 ── */
  .corner{position:absolute; font-size:168px; font-weight:400; letter-spacing:-.025em;
    color:var(--ink); user-select:none; pointer-events:none; white-space:nowrap; line-height:1;
    transform-origin:50% 50%; will-change:transform;
    transition:transform 1.35s cubic-bezier(.62,.03,.2,1), opacity .55s ease}
  .corner.noAnim{transition:none}
  #cornerA{left:34px; top:56px}
  #cornerB{right:34px; bottom:64px}
  /* 开场期间星图内容先不出现,等词分开时一起淡入。
     intro 类写在 HTML 上,保证首屏第一帧就是隐藏态 —— 若等 JS 再加,
     用户会先瞥见星图再看它淡出。*/
  #nodes,#wires{transition:opacity .95s ease .28s}
  #stage.intro #nodes, #stage.intro #wires{opacity:0}
  /* 两个词等 playIntro 把它们摆到中间后再显形,避免先在角落闪一帧 */
  .corner{opacity:0}
  #stage.armed .corner{opacity:1}
  .hud{opacity:0; transition:opacity .7s ease .5s}
  .hud.in{opacity:1}
  /* 开场停住,等用户滚一下再打开 */
  #enterCue{position:fixed; left:50%; bottom:46px; transform:translateX(-50%); z-index:45;
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
    background:rgba(251,250,248,.9); border:1px solid var(--line); border-radius:999px;
    padding:10px 18px; opacity:0; transition:opacity .6s ease .9s; pointer-events:none}
  #enterCue.in{opacity:1}
  #enterCue.out{opacity:0; transition:opacity .3s ease}
  #enterCue i{font-style:normal; animation:bob 1.9s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

  /* 星系标题 */
  .cluster{position:absolute; width:360px; margin-left:-180px; text-align:center;
    cursor:pointer; user-select:none; transition:opacity .3s}
  .cluster h2{font-size:31px; font-weight:600; line-height:1.28; letter-spacing:-.01em; transition:color .22s}
  .cluster p{margin-top:10px; font-size:15px; line-height:1.62; color:var(--muted); transition:opacity .22s}
  .cluster .cnt{display:inline-block; margin-top:11px; font-size:13px; font-weight:700;
    letter-spacing:.08em; padding:3px 9px; border-radius:999px; transition:.22s}
  .cluster:hover h2{color:var(--sc)}
  .cluster:hover .cnt{transform:translateY(-1px)}

  /* 图块 */
  .tile{position:absolute; padding:0; border:0; background:none; cursor:pointer; line-height:0;
    transition:filter .3s, opacity .3s; will-change:transform; border-radius:1px;
    /* 各自不同的方向/幅度/周期/相位,才有一片“各自呼吸”的感觉 */
    animation:drift var(--dur,8s) var(--delay,0s) ease-in-out infinite alternate}
  @keyframes drift{ from{transform:translate(0,0)} to{transform:translate(var(--fx,4px), var(--fy,-5px))} }
  /* 缩放放在内层 svg 上 —— .tile 的 transform 已经给漂浮动画占用了 */
  .tile svg{display:block; box-shadow:0 1px 3px rgba(20,20,15,.12);
    transition:transform .34s cubic-bezier(.22,.68,.24,1)}
  .tile:hover{z-index:5; filter:drop-shadow(0 12px 22px rgba(20,20,15,.22))}
  .tile:hover svg{transform:scale(1.28) translateY(-3px)}
  .tile:focus-visible{outline:2px solid var(--cta); outline-offset:3px}
  .tile .vtag{position:absolute; right:-4px; top:-5px; width:13px; height:13px; border-radius:50%;
    background:var(--cta); color:#fff; font-size:8px; line-height:13px; text-align:center; font-weight:800}
  .tile .dtag{position:absolute; left:-3px; bottom:-4px; font-size:7.5px; font-weight:800; letter-spacing:.05em;
    background:var(--ink); color:#fff; padding:1px 4px; border-radius:2px; line-height:1.35}

  /* 淡出未选中的 */
  .dim .tile:not(.on){opacity:.12; filter:grayscale(.85)}
  .dim .cluster:not(.on){opacity:.26}
  .dim .wire:not(.lit){opacity:.05}
  /* 被点亮的要真的“亮”起来:浅色 riso 图块光靠不淡出还不够跳 */
  .dim .tile.on{z-index:4; filter:drop-shadow(0 7px 16px rgba(20,20,15,.2)) saturate(1.15)}
  .dim .tile.on svg{transform:scale(1.12)}

  /* ── HUD ── */
  .hud{position:fixed; z-index:40; display:flex; align-items:center; gap:8px}
  #hint{left:26px; bottom:24px; font-size:12.5px; color:var(--muted); background:rgba(251,250,248,.86);
    border:1px solid var(--line); padding:9px 15px; border-radius:999px; backdrop-filter:blur(6px)}
  #zoom{right:26px; bottom:24px; font-size:12.5px; color:var(--muted)}
  #zoom button{width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:rgba(251,250,248,.9); font-size:16px; cursor:pointer; color:var(--ink);
    font-family:inherit; transition:.16s; backdrop-filter:blur(6px)}
  #zoom button:hover:not(:disabled){border-color:#b9b3a5; transform:translateY(-1px)}
  #zoom button:active:not(:disabled){transform:translateY(0) scale(.94)}
  #zoom button:disabled{opacity:.38; cursor:default}

  /* ── 详情 ── */
  #overlay{position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:24px;
    background:rgba(247,244,237,.62); backdrop-filter:blur(15px) saturate(.32); opacity:0;
    transition:opacity .3s ease}
  #overlay.show{display:grid; opacity:1}
  .detail{width:min(430px,92vw); max-height:92vh; overflow-y:auto; text-align:center;
    transform:translateY(14px) scale(.97); transition:transform .38s cubic-bezier(.22,.68,.24,1)}
  #overlay.show .detail{transform:none}
  .bigart{display:inline-block; line-height:0; box-shadow:0 26px 60px -18px rgba(20,20,15,.4)}
  /* 只约束一边,另一边 auto —— 同时限宽高会破坏比例、把图信箱化 */
  .bigart svg, .bigart img{display:block; width:min(320px,70vw); height:auto}
  .bigart.portrait svg, .bigart.portrait img{width:auto; height:min(302px,36vh)}
  .dcard{position:relative; margin-top:-16px; background:#fbfaf8; border:1px solid var(--line);
    border-radius:12px; padding:20px 20px 18px; text-align:left;
    box-shadow:0 20px 44px -20px rgba(20,20,15,.3)}
  .dclose{position:absolute; right:12px; top:12px; width:26px; height:26px; border-radius:50%;
    border:0; background:#eeebe4; color:#4b483f; font-size:15px; cursor:pointer; line-height:1; font-family:inherit}
  .dclose:hover{background:#e2ded6}
  .dsc{font-size:10.5px; font-weight:800; letter-spacing:.1em; padding:3px 9px; border-radius:999px; display:inline-block}
  .dname{margin-top:10px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2; word-break:break-word; padding-right:20px}
  .dtag2{margin-top:9px; font-size:13.5px; line-height:1.6; color:#4b483f}
  .dthemes{margin-top:11px; font-size:11.5px; color:var(--muted)}
  .trybox{margin-top:15px; border:1px solid var(--line); border-radius:9px; background:#f4f2ec; overflow:hidden}
  .tryhead{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; border-bottom:1px solid var(--line); background:#efece4}
  .tryhead span{font-size:10.5px; font-weight:800; letter-spacing:.09em; color:var(--muted)}
  .copyBtn{border:0; background:var(--ink); color:#fff; font-size:11px; font-weight:700; font-family:inherit;
    padding:5px 12px; border-radius:999px; cursor:pointer; transition:.16s; white-space:nowrap}
  .copyBtn:hover{background:#000}
  .copyBtn.done{background:var(--cta)}
  .trytext{padding:13px; font-size:13.5px; line-height:1.68; color:#26241d; word-break:break-word}
  .dfoot{margin-top:13px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .dlink{font-size:12.5px; font-weight:700; color:var(--cta); text-decoration:none}
  .dlink:hover{text-decoration:underline}
  .dsrc{font-size:10.5px; color:var(--muted); letter-spacing:.06em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  @media (max-width:760px){
    .corner{font-size:108px}
    #cornerA{left:18px; top:44px} #cornerB{right:18px; bottom:50px}
    .cluster{width:250px; margin-left:-125px}
    .cluster h2{font-size:26px}
    #hint{left:14px; bottom:16px; font-size:11.5px; padding:8px 12px}
    #zoom{right:14px; bottom:16px}
    header{padding:14px 16px}
    .nlink{padding:6px 11px; font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important; animation:none !important}
  }
</style>
</head>

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── 建图 ── */
function build(){
  $('ghRepo').href = DATA.repo;
  const W = DATA.world.w, H = DATA.world.h;
  const stg = $('stage');
  stg.style.width = W + 'px';
  stg.style.height = H + 'px';

  const wires = $('wires');
  wires.setAttribute('width', W); wires.setAttribute('height', H);
  wires.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const lines = [];
  DATA.skills.forEach(s => {
    const put = (key, alt) => {
      const c = SC[key]; if (!c) return;
      lines.push(`<line class="wire${alt?' alt':''}" data-skill="${esc(s.id)}" data-sc="${esc(key)}"
        style="--sc:${c.color.fg}" x1="${c.x}" y1="${c.y}" x2="${s.x}" y2="${s.y}"/>`);
    };
    put(s.scenario, false);
    (s.also || []).forEach(k => put(k, true));
  });
  wires.innerHTML = lines.join('');

  const html = [];
  DATA.scenarios.forEach(c => {
    html.push(`<div class="cluster" data-sc="${esc(c.key)}" style="left:${c.x}px; top:${c.y - 66}px; --sc:${c.color.fg}">
      <h2 class="serif">${esc(c.title)}</h2>
      <p>${esc(c.blurb)}</p>
      <span class="cnt" style="background:${c.color.bg}; color:${c.color.ink}">${c.count} 个技能</span>
    </div>`);
  });
  DATA.skills.forEach(s => {
    html.push(`<button class="tile" data-id="${esc(s.id)}" data-sc="${esc(s.scenario)}"
      style="left:${s.x - s.w/2}px; top:${s.y - s.h/2}px;
        --fx:${s.fx}px; --fy:${s.fy}px; --dur:${s.dur}s; --delay:${s.delay}s"
      title="${esc(s.name)}" aria-label="${esc(s.name)}：${esc(s.tagline)}">
      ${s.svg}${s.hasDemo ? '<span class="dtag">DEMO</span>' : ''}${s.verified ? '<span class="vtag">✓</span>' : ''}
    </button>`);
  });
  $('nodes').innerHTML = html.join('');
}

/* ── 平移缩放 ── */
const view = { x:0, y:0, k:1 };
const MIN_K = 0.3, MAX_K = 3.2;
const box = () => $('viewport').getBoundingClientRect();

/* 把平移夹在「图始终占住视野」的范围内 ——
   最多只让出 12% 的空白,不允许把整张图拖到角落去。*/
function clampView(){
  const b = box();
  const w = DATA.world.w * view.k, h = DATA.world.h * view.k;
  const padX = b.width * 0.12, padY = b.height * 0.12;
  const loX = b.width - padX - w, hiX = padX;
  view.x = loX > hiX ? (b.width - w) / 2 : Math.min(hiX, Math.max(loX, view.x));
  const loY = b.height - padY - h, hiY = padY;
  view.y = loY > hiY ? (b.height - h) / 2 : Math.min(hiY, Math.max(loY, view.y));
}
function apply(){
  if (!fitted) return;
  clampView();
  $('stage').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  $('zin').disabled  = view.k >= MAX_K - 1e-3;
  $('zout').disabled = view.k <= MIN_K + 1e-3;
}
/* 若此刻拿不到真实尺寸(后台标签页、面板未展开),算出来会是 scale(0) 整张图消失。
   这里先不算,等 Resize/Intersection 观察到真实尺寸再补上。*/
let fitted = false, introPlayed = false;
function fit(){
  const b = box();
  if (b.width < 2 || b.height < 2) return;
  view.k = Math.min(b.width / DATA.world.w, b.height / DATA.world.h) * 0.94;
  view.x = (b.width - DATA.world.w * view.k) / 2;
  view.y = (b.height - DATA.world.h * view.k) / 2;
  fitted = true;
  apply();
  if (!introPlayed) { introPlayed = true; playIntro(); }
}
function zoomAt(cx, cy, factor){
  const k = Math.min(MAX_K, Math.max(MIN_K, view.k * factor));
  const r = k / view.k;
  view.x = cx - (cx - view.x) * r;
  view.y = cy - (cy - view.y) * r;
  view.k = k;
  apply();
}

/* ── 进场:Inno Agent 先合在中间,再向两角打开,星图随之浮现 ── */
function revealAll(){
  $('topbar').classList.add('in');
  $('hint').classList.add('in');
  $('zoom').classList.add('in');
}
function playIntro(){
  const a = $('cornerA'), b = $('cornerB'), stg = $('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bx = box();
  if (reduce || bx.width < 2) {          // 降级:不做动画,直接呈现最终态
    opened = true; armedForEnter = true;
    stg.classList.remove('intro'); stg.classList.add('armed'); revealAll(); return;
  }

  const ra = {x:a.offsetLeft, y:a.offsetTop, w:a.offsetWidth, h:a.offsetHeight};
  const rb = {x:b.offsetLeft, y:b.offsetTop, w:b.offsetWidth, h:b.offsetHeight};
  const gap = 42, total = ra.w + gap + rb.w;
  // 让整句在屏幕上约占 58% 宽
  const S = Math.max(1, Math.min(2.8, (bx.width * 0.58) / (total * view.k)));
  const cx = bx.width / 2, cy = bx.height / 2;
  // 先算屏幕上的落点,再换算回世界坐标(stage 被 view.k 缩放过)
  const sAx = cx - total * view.k * S / 2 + ra.w * view.k * S / 2;
  const sBx = cx + total * view.k * S / 2 - rb.w * view.k * S / 2;
  const toWorldX = sx => (sx - view.x) / view.k;
  const wY = (cy - view.y) / view.k;
  const dA = { x: toWorldX(sAx) - (ra.x + ra.w/2), y: wY - (ra.y + ra.h/2) };
  const dB = { x: toWorldX(sBx) - (rb.x + rb.w/2), y: wY - (rb.y + rb.h/2) };

  a.classList.add('noAnim'); b.classList.add('noAnim');
  a.style.transform = `translate(${dA.x}px, ${dA.y}px) scale(${S})`;
  b.style.transform = `translate(${dB.x}px, ${dB.y}px) scale(${S})`;
  void stg.offsetWidth;                       // 强制回流,让起始态先生效
  a.classList.remove('noAnim'); b.classList.remove('noAnim');
  stg.classList.add('armed');                 // 摆好位置了,让两个词淡入

  $('enterCue').classList.add('in');
  // 开场停在这里,等用户滚一下(或点/按键)再向两角打开。
  // 留 400ms 静默期:加载瞬间的杂散事件不该把开场直接跳掉。
  setTimeout(() => {
    armedForEnter = true;
    ['wheel','touchmove','keydown','pointerdown'].forEach(ev =>
      addEventListener(ev, enterMap, {passive:true}));
  }, 400);
}

let opened = false, armedForEnter = false;
function enterMap(){
  if (opened || !armedForEnter) return; opened = true;
  const cue = $('enterCue');
  cue.classList.remove('in'); cue.classList.add('out');
  $('cornerA').style.transform = ''; $('cornerB').style.transform = '';
  $('stage').classList.remove('intro');
  revealAll();
  ['wheel','touchmove','keydown','pointerdown'].forEach(ev => removeEventListener(ev, enterMap));
}

function initPanZoom(){
  const vp = $('viewport');
  let down = false, px = 0, py = 0;
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('.tile, .cluster')) return;
    down = true; px = e.clientX; py = e.clientY;
    vp.classList.add('dragging'); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => {
    if (!down) return;
    view.x += e.clientX - px; view.y += e.clientY - py;
    px = e.clientX; py = e.clientY; apply();
  });
  const up = e => { down = false; vp.classList.remove('dragging');
    try { vp.releasePointerCapture(e.pointerId); } catch(_) {} };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
  vp.addEventListener('wheel', e => {
    if (!opened) return;               // 开场时滚轮是“进入”,不是缩放
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
  }, {passive:false});
  const mid = () => { const b = box(); return [b.width/2, b.height/2]; };
  $('zin').onclick  = () => zoomAt(...mid(), 1.28);
  $('zout').onclick = () => zoomAt(...mid(), 1/1.28);
  // 尺寸变了:没 fit 过就补 fit,已 fit 过只重新夹紧(保住用户的缩放与位置)
  addEventListener('resize', () => fitted ? apply() : fit());
  new ResizeObserver(() => { if (!fitted) fit(); }).observe(vp);
  new IntersectionObserver(es => { if (!fitted && es.some(e => e.isIntersecting)) fit(); }).observe(vp);
}

/* ── 悬浮联动 ── */
function initHighlight(){
  const stg = $('stage');
  const lightSc = key => {
    stg.classList.add('dim');
    DATA.skills.forEach(s => {
      const on = s.scenario === key || (s.also||[]).includes(key);
      const el = stg.querySelector(`.tile[data-id="${CSS.escape(s.id)}"]`);
      if (el) el.classList.toggle('on', on);
    });
    stg.querySelectorAll('.cluster').forEach(c => c.classList.toggle('on', c.dataset.sc === key));
    stg.querySelectorAll('.wire').forEach(w => w.classList.toggle('lit', w.dataset.sc === key));
  };
  const lightSkill = id => {
    stg.classList.add('dim');
    stg.querySelectorAll('.tile').forEach(t => t.classList.toggle('on', t.dataset.id === id));
    stg.querySelectorAll('.cluster').forEach(c => c.classList.remove('on'));
    stg.querySelectorAll('.wire').forEach(w => w.classList.toggle('lit', w.dataset.skill === id));
  };
  const clear = () => {
    stg.classList.remove('dim');
    stg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
    stg.querySelectorAll('.wire.lit').forEach(e => e.classList.remove('lit'));
  };
  stg.addEventListener('pointerover', e => {
    const c = e.target.closest('.cluster'); if (c) return lightSc(c.dataset.sc);
    const t = e.target.closest('.tile');   if (t) return lightSkill(t.dataset.id);
  });
  stg.addEventListener('pointerout', e => {
    if (!e.relatedTarget || !e.relatedTarget.closest('.cluster, .tile')) clear();
  });
}

let lastFocus = null;
function openDetail(id){
  const s = DATA.skills.find(x => x.id === id); if (!s) return;
  const c = SC[s.scenario] || {color:{bg:'#eee',fg:'#555',ink:'#333'}, title:''};
  const themes = [c.title, ...(s.also||[]).map(k => SC[k] && SC[k].title).filter(Boolean)];
  $('detail').innerHTML = `
    <div class="bigart${!s.hasDemo && s.h > s.w ? ' portrait' : ''}">${s.hasDemo ? `<img src="${esc(s.demo)}" alt="${esc(s.name)} 演示">` : s.svg}</div>
    <div class="dcard">
      <button class="dclose" id="dclose" aria-label="关闭">×</button>
      <span class="dsc" style="background:${c.color.bg}; color:${c.color.ink}">${esc(s.scenario)}</span>
      <div class="dname serif">${esc(s.name)}</div>
      <div class="dtag2">${esc(s.tagline)}</div>
      <div class="dthemes">属于：${themes.map(esc).join(' · ')}</div>
      <div class="trybox">
        <div class="tryhead"><span>试试这句话</span>
          <button class="copyBtn" id="copyBtn">复制</button></div>
        <div class="trytext" id="tryText">${esc(s.example)}</div>
      </div>
      <div class="dfoot">
        <a class="dlink" href="${skillUrl(s)}" target="_blank" rel="noopener">打开 &amp; 安装 →</a>
        <span class="dsrc">${esc(s.refText || 'inno-agent-hub')}</span>
      </div>
    </div>`;
  lastFocus = document.activeElement;
  $('overlay').classList.add('show');
  $('dclose').onclick = closeDetail;
  $('copyBtn').onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(s.example); }
    catch(_) {
      const ta = document.createElement('textarea');
      ta.value = s.example; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(__) {}
      ta.remove();
    }
    b.textContent = '已复制 ✓'; b.classList.add('done');
    setTimeout(() => { b.textContent = '复制'; b.classList.remove('done'); }, 1900);
  };
  $('dclose').focus();
}
function closeDetail(){
  $('overlay').classList.remove('show');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function initDetail(){
  $('nodes').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (t) return openDetail(t.dataset.id);
    const c = e.target.closest('.cluster');
    if (c) {
      const first = DATA.skills.find(s => s.scenario === c.dataset.sc);
      if (first) openDetail(first.id);
    }
  });
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeDetail(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
}

build(); fit(); initPanZoom(); initHighlight(); initDetail();

/* 兜底:后台标签页 / 面板未展开时首次 fit 拿不到尺寸,
   而观察器在个别环境里也不一定触发 —— 再补几次延迟重试。*/
requestAnimationFrame(() => { if (!fitted) fit(); });
addEventListener('load', () => { if (!fitted) fit(); });
[120, 400, 1200].forEach(d => setTimeout(() => { if (!fitted) fit(); }, d));
// 最后兜底:始终拿不到尺寸也不能让星图一直藏着
setTimeout(() => {
  if (!introPlayed) { introPlayed = true; playIntro(); }
  if (!fitted) { armedForEnter = true; $('stage').classList.add('armed'); enterMap(); }   // 尺寸始终拿不到,别把星图永远藏着
}, 2600);
</script>
</body>
</html>
