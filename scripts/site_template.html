<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inno Agent · 技能库</title>
<meta name="description" content="Inno Agent Skill Library — 面向教学、创作、研究与开发的可直接调用技能集合。">
<link rel="canonical" href="{{SITE_URL}}{{PAGE}}">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Inno Agent">
<meta property="og:title" content="Inno Agent · 技能库">
<meta property="og:description" content="面向教学、自学、研究与创作的 {{COUNT}} 个可直接调用 Agent 技能。">
<meta property="og:url" content="{{SITE_URL}}{{PAGE}}">
<meta property="og:image" content="{{SITE_URL}}og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#f2f0ec; --card:#fbfaf8; --ink:#14140f; --muted:#6f6c63;
    --line:#e2ded6; --cta:#1f6f4a;
    --max:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px}
  .label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
  h1,h2{font-weight:800; letter-spacing:-.035em; line-height:.95}
  h1{font-size:clamp(44px,7.5vw,104px)}
  h2{font-size:clamp(34px,5.5vw,72px)}

  /* header */
  header{padding:28px 0; border-bottom:1px solid var(--line)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .logo{font-weight:800; letter-spacing:-.02em; font-size:17px}
  .logo span{color:var(--cta)}
  .ghlink{font-size:13px; color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:7px 14px; border-radius:999px; background:var(--card); white-space:nowrap}
  .ghlink:hover{color:var(--ink); border-color:#c9c4b8}

  /* hero */
  .hero{padding:64px 0 40px; display:grid; grid-template-columns:1.5fr 1fr; gap:32px; align-items:end}
  .hero p{color:var(--muted); font-size:15px; max-width:38ch}
  .stats{display:flex; gap:26px; margin-top:22px; flex-wrap:wrap}
  .stat b{display:block; font-size:26px; font-weight:800; letter-spacing:-.02em}
  .stat span{font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase}

  /* search */
  .search{display:flex; align-items:stretch; margin-top:30px; max-width:540px;
    border-bottom:1.5px solid var(--ink); transition:border-color .2s}
  .search:focus-within{border-color:var(--cta)}
  .search input{flex:1; min-width:0; border:0; background:transparent; padding:12px 2px;
    font-size:15px; font-family:inherit; color:var(--ink); outline:none}
  .search input::placeholder{color:#a09b8f}
  .search button{background:#a8ccb0; border:0; padding:0 24px; font-weight:700; font-size:13.5px;
    color:#14140f; cursor:pointer; font-family:inherit; transition:background .18s, transform .18s}
  .search button:hover{background:#93bf9e}
  .search button:active{transform:scale(.97)}
  .shint{margin-top:9px; font-size:12px; color:var(--muted)}
  .clearBtn{background:none; border:0; color:var(--cta); font-weight:700; cursor:pointer;
    font-family:inherit; font-size:12.5px; text-decoration:underline; padding:0}

  /* featured */
  .feat{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding-bottom:56px}
  .fcard{display:grid; grid-template-columns:230px 1fr; background:var(--card); border:1px solid var(--line); overflow:hidden}
  .cover{position:relative; padding:16px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; min-height:210px; overflow:hidden}
  .cover .rings{position:absolute; top:-58px; right:-58px; width:190px; height:190px; opacity:.45; pointer-events:none}
  .cover .demoImg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .cover .scrim{position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.18) 52%, rgba(0,0,0,.3) 100%)}
  .cover .ctop{position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .cover .cbot{position:relative; min-width:0}
  .cover .num{font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:.85; flex-shrink:0}
  .cover .cname{font-size:21px; font-weight:800; letter-spacing:-.03em; line-height:1.08; overflow-wrap:anywhere}
  .cover .cmeta{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; opacity:.72; margin-top:7px}
  .cover .kicker{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; opacity:.62; padding-top:5px}
  .cover .bars{display:flex; gap:2.5px; align-items:flex-end; height:15px; margin-top:9px}
  .cover .bars i{width:3.5px; background:currentColor; opacity:.55; border-radius:1px}
  .cover.hasDemo{color:#fff}
  .cover.hasDemo .kicker,.cover.hasDemo .num,.cover.hasDemo .cname,.cover.hasDemo .cmeta{
    text-shadow:0 1px 14px rgba(0,0,0,.55); opacity:1}
  .cover.hasDemo .kicker,.cover.hasDemo .cmeta{opacity:.9}
  .demoTag{position:absolute; right:14px; bottom:14px; font-size:9.5px; font-weight:800; letter-spacing:.08em;
    background:rgba(0,0,0,.72); color:#fff; padding:3px 7px; border-radius:3px; z-index:2}
  .info{padding:18px; display:flex; flex-direction:column; gap:9px}
  .irow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .owner{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .badges{display:flex; gap:5px; flex-shrink:0}
  .b{font-size:10px; font-weight:700; padding:2.5px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
  .b.orig{background:#efe6d4; color:#7a5c1e; border-color:#e2d3b4}
  .b.ok{background:#e2f0e6; color:var(--cta); border-color:#c6e2ce}
  .iname{font-size:21px; font-weight:800; letter-spacing:-.025em; line-height:1.15; word-break:break-word}
  .idesc{font-size:13.5px; color:#4b483f; line-height:1.55; flex:1}
  .cta{display:flex; align-items:center; justify-content:space-between; margin-top:4px; text-decoration:none}
  .cta b{font-size:13px; color:var(--cta); font-weight:700}
  .arrow{width:30px; height:30px; border-radius:50%; background:var(--cta); color:#fff; display:grid; place-items:center; font-size:14px; flex-shrink:0}

  /* ── hover 动效:统一缓动,卡片抬起 + 内部元素分层响应 ── */
  .fcard,.gcard{
    --e:cubic-bezier(.22,.68,.24,1);
    transition:transform .34s var(--e), box-shadow .34s var(--e), border-color .24s ease;
    will-change:transform;
  }
  .fcard:hover,.gcard:hover{
    transform:translateY(-6px);
    box-shadow:0 22px 48px -16px rgba(20,20,15,.24), 0 6px 16px -8px rgba(20,20,15,.12);
    border-color:#cec8ba;
  }
  .cover .rings{transition:transform .62s var(--e,cubic-bezier(.22,.68,.24,1)), opacity .4s ease}
  .fcard:hover .rings,.gcard:hover .rings{transform:scale(1.16) rotate(9deg); opacity:.62}
  .cover .demoImg{transition:transform .62s var(--e,cubic-bezier(.22,.68,.24,1))}
  .fcard:hover .demoImg,.gcard:hover .demoImg{transform:scale(1.07)}
  .cover .num{transition:transform .34s var(--e,cubic-bezier(.22,.68,.24,1))}
  .fcard:hover .num,.gcard:hover .num{transform:translateY(-2px) scale(1.07)}
  .cover .bars i{transition:height .38s var(--e,cubic-bezier(.22,.68,.24,1))}
  .fcard:hover .bars i:nth-child(1),.gcard:hover .bars i:nth-child(1){height:13px}
  .fcard:hover .bars i:nth-child(2),.gcard:hover .bars i:nth-child(2){height:6px}
  .fcard:hover .bars i:nth-child(3),.gcard:hover .bars i:nth-child(3){height:15px}
  .fcard:hover .bars i:nth-child(4),.gcard:hover .bars i:nth-child(4){height:9px}
  .arrow{transition:transform .3s var(--e,cubic-bezier(.22,.68,.24,1)), background .2s ease}
  .fcard:hover .arrow,.gcard:hover .arrow{transform:translateX(4px); background:#175a3b}
  .iname{transition:color .2s ease}
  .fcard:hover .iname,.gcard:hover .iname{color:var(--cta)}

  /* pill 动效 */
  .pill{transition:background .2s ease, color .2s ease, border-color .2s ease, transform .18s cubic-bezier(.22,.68,.24,1)}
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important; animation:none !important; scroll-behavior:auto !important}
    .fcard:hover,.gcard:hover{transform:none}
  }

  /* library */
  .libhead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; padding-bottom:22px; border-top:1px solid var(--line); padding-top:56px}
  .pills{display:flex; gap:7px; flex-wrap:wrap}
  .pill{font-size:12.5px; font-weight:600; padding:8px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer; font-family:inherit; transition:.14s}
  .pill:hover{border-color:#b9b3a5; color:var(--ink)}
  .pill[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .count{font-size:12.5px; color:var(--muted); padding:14px 0 18px}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding-bottom:80px}
  .gcard{background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden}
  .gcard .cover{min-height:172px}
  .gcard .cover .num{font-size:34px}
  .gcard .cover .cname{font-size:19px}
  .gcard .info{gap:8px}
  .gcard .iname{font-size:18px}
  .gcard .idesc{font-size:13px; min-height:3em}

  footer{border-top:1px solid var(--line); padding:26px 0 54px; font-size:12.5px; color:var(--muted);
    display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}
  footer a{color:var(--muted)}
  .empty{padding:48px 0; color:var(--muted); font-size:14px}

  @media (max-width:1000px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .feat{grid-template-columns:1fr}
    .hero{grid-template-columns:1fr; align-items:start; gap:18px; padding-top:48px}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .fcard{grid-template-columns:1fr}
    .cover{min-height:150px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo">Inno Agent <span>/</span> 技能库</div>
    <div style="display:flex; gap:8px; align-items:center">
      <a class="ghlink" href="./index.html">← 回星图</a>
      <a class="ghlink" id="ghRepo" href="#" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="label">Start here</div>
      <h1 style="margin-top:14px">为教学而生<br>的技能库</h1>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" autocomplete="off" placeholder="你的 agent 需要学会什么?试试「批改作文」「立体几何」" aria-label="搜索技能">
        <button type="submit">搜索</button>
      </form>
      <div class="shint" id="shint">支持按名称、分类、用途和<b>触发词</b>搜索</div>
    </div>
    <div>
      <p>可直接调用的具体能力 —— 备课、批改、讲题、创作、研究。下载即用,上传到工作区就能跑。</p>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section class="feat" id="featured"></section>

  <div class="libhead">
    <div>
      <div class="label">The library</div>
      <h2 style="margin-top:12px">全部技能</h2>
    </div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="count" id="count"></div>
  <section class="grid" id="grid"></section>
</main>

<footer class="wrap">
  <div>Inno Agent Skill Library · 数据由 <code>skill-library/</code> 自动生成</div>
  <div id="gen"></div>
</footer>

<script>
const DATA = /*__DATA__*/null;
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skillUrl = s => `${DATA.repo}/tree/main/skill-library/${s.id}`;

const rings = fg => `<svg class="rings" viewBox="0 0 100 100" fill="none" stroke="${fg}" stroke-width="1.4">
  <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="11"/></svg>`;
const bars = () => `<div class="bars">${[7,11,15,9].map(h=>`<i style="height:${h}px"></i>`).join('')}</div>`;

function badges(s){
  const b = [];
  if (s.type === '原创') b.push('<span class="b orig">原创</span>');
  if (s.verified) b.push('<span class="b ok">✓ 已验证</span>');
  if (!b.length) b.push(`<span class="b">${esc(s.type||'收集')}</span>`);
  return b.join('');
}

function cover(s){
  const {bg, fg} = s.color;
  const d = !!s.demo;
  const layer = d
    ? `<img class="demoImg" src="${esc(s.demo)}" alt="${esc(s.name)} 演示" loading="lazy"><div class="scrim"></div>`
    : rings(fg);
  return `<div class="cover${d ? ' hasDemo' : ''}" style="background:${bg}${d ? '' : `;color:${fg}`}">
    ${layer}
    <div class="ctop">
      <div class="kicker">Inno / Skill ${s.num}</div>
      <div class="num">${s.num}</div>
    </div>
    <div class="cbot">
      <div class="cname">${esc(s.name)}</div>
      <div class="cmeta">${esc(s.category)}</div>
      ${d ? '' : bars()}
    </div>
    ${d ? '<span class="demoTag">▶ DEMO</span>' : ''}
  </div>`;
}

function info(s){
  return `<div class="info">
    <div class="irow">
      <div class="owner">${esc(s.refText || 'inno-agent-hub')}</div>
      <div class="badges">${badges(s)}</div>
    </div>
    <div class="iname">${esc(s.name)}</div>
    <div class="idesc">${esc(s.tagline)}</div>
    <a class="cta" href="${skillUrl(s)}" target="_blank" rel="noopener">
      <b>打开 &amp; 安装</b><span class="arrow">→</span>
    </a>
  </div>`;
}

const fcard = s => `<article class="fcard">${cover(s)}${info(s)}</article>`;
const gcard = s => `<article class="gcard">${cover(s)}${info(s)}</article>`;

let active = '全部';
let query = '';

// 搜索域:名称/分类/一句话/完整描述(内含触发词)/来源
DATA.skills.forEach(s => {
  s._h = [s.id, s.name, s.category, s.tagline, s.description, s.refText].join(' ').toLowerCase();
});
const hit = s => !query || query.split(/\s+/).filter(Boolean).every(t => s._h.includes(t));

function render(){
  const list = DATA.skills.filter(s => (active === '全部' || s.category === active) && hit(s));
  const bits = [];
  if (active !== '全部') bits.push(esc(active));
  if (query) bits.push(`“${esc(query)}”`);
  document.getElementById('count').innerHTML =
    `${list.length} 个技能${bits.length ? ' · ' + bits.join(' · ') : ''}` +
    (bits.length ? ' &nbsp;<button class="clearBtn" id="clearF">清除</button>' : '');
  document.getElementById('grid').innerHTML = list.length
    ? list.map(gcard).join('')
    : `<div class="empty">没有匹配的技能${query ? `:「${esc(query)}」` : ''} —— 换个词,或点上面的分类看看。</div>`;
  document.querySelectorAll('#pills .pill').forEach(p =>
    p.setAttribute('aria-pressed', String(p.dataset.cat === active)));
  // 搜索时收起「精选」,让结果成为主角
  document.getElementById('featured').style.display = query ? 'none' : '';
  const cf = document.getElementById('clearF');
  if (cf) cf.onclick = () => { query = ''; active = '全部'; document.getElementById('q').value = ''; render(); };
}

function init(){
  document.getElementById('ghRepo').href = DATA.repo;
  document.getElementById('gen').textContent = `更新于 ${DATA.generated}`;

  const verified = DATA.skills.filter(s => s.verified).length;
  const demos = DATA.skills.filter(s => s.hasDemo).length;
  document.getElementById('stats').innerHTML = [
    [DATA.count, '技能'], [DATA.categories.length, '分类'],
    [verified, '已验证'], [demos, '带演示'],
  ].map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  document.getElementById('featured').innerHTML =
    DATA.skills.filter(s => s.featured).map(fcard).join('');

  const cats = ['全部', ...DATA.categories.map(c => c.name)];
  document.getElementById('pills').innerHTML = cats.map(c => {
    const n = c === '全部' ? DATA.count : (DATA.categories.find(x => x.name === c)?.count ?? 0);
    return `<button class="pill" data-cat="${esc(c)}" aria-pressed="false">${esc(c)} ${n}</button>`;
  }).join('');
  document.getElementById('pills').addEventListener('click', e => {
    const b = e.target.closest('.pill'); if (!b) return;
    active = b.dataset.cat; render();
  });

  // 搜索:边打边筛 + 回车滚到结果
  const q = document.getElementById('q');
  q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); render(); });
  document.getElementById('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    query = q.value.trim().toLowerCase();
    render();
    document.querySelector('.libhead').scrollIntoView({behavior:'smooth', block:'start'});
  });

  render();
}
init();
</script>
</body>
</html>
